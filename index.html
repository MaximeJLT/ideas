<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Things to do</title>
    <!-- Nouvelles Polices : Inter (Architecture/Design) + Space Mono (Tech/ML) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFFFFF;       /* Blanc pur */
            --text-color: #111111;     /* Noir profond */
            --meta-color: #888888;     /* Gris technique */
            --line-color: #E0E0E0;     /* Gris clair pour les lignes de structure */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif; /* Base épurée et géométrique */
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER (Architectural) --- */
        header {
            border-bottom: 1px solid var(--text-color); /* Ligne de fondation */
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-weight: 400;
            font-size: 1.6rem;
            line-height: 1.2;
            letter-spacing: -0.04em; /* Typographie resserrée, très moderne */
            margin-bottom: 8px;
        }

        .subtitle {
            font-family: 'Space Mono', monospace; /* Touche Tech */
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--meta-color);
            letter-spacing: 0.05em;
        }

        /* --- INPUT ZONE (Nerd / Terminal Vibe) --- */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
        }

        .terminal-box {
            display: flex;
            align-items: center;
            background: #F8F8F8;
            border: 1px solid var(--line-color);
            padding: 12px 15px;
        }

        .prompt {
            font-family: 'Space Mono', monospace;
            color: var(--meta-color);
            margin-right: 15px;
            font-size: 0.85rem;
            user-select: none;
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            font-family: 'Space Mono', monospace; /* L'utilisateur tape du code/data */
            font-size: 0.85rem;
            color: var(--text-color);
            outline: none;
        }

        input[type="text"]::placeholder {
            color: #C0C0C0;
        }

        button {
            align-self: flex-end;
            background: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 12px 24px;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            background: var(--meta-color);
        }

        /* --- FEEDBACK MESSAGE --- */
        #feedback-message {
            display: none;
            font-weight: 300;
            font-style: italic; /* La seule touche romantique du design */
            font-size: 1.1rem;
            color: var(--text-color);
            text-align: center;
            padding: 30px 0;
            border: 1px dashed var(--line-color);
            margin-bottom: 40px;
            animation: fadeInOut 3s forwards;
        }

        /* --- LIST ZONE (Data Grid) --- */
        #list-container {
            display: none;
            flex-direction: column;
        }

        .list-header {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--meta-color);
            border-bottom: 1px solid var(--line-color);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .idea-item {
            display: grid;
            grid-template-columns: 45px 1fr; /* Structure en grille stricte */
            gap: 10px;
            padding: 15px 0;
            border-bottom: 1px solid var(--line-color);
            animation: slideIn 0.3s ease-out;
        }

        .idea-index {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--meta-color);
            margin-top: 2px; /* Alignement optique avec le texte */
        }

        .idea-text {
            font-size: 0.95rem;
            line-height: 1.4;
            font-weight: 300;
        }

        /* --- ANIMATIONS --- */
        @keyframes fadeInOut {
            0% { opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <header>
            <h1>things to do between two beautiful people.</h1>
            <div class="subtitle">Dataset: Ideas & Memories</div>
        </header>

        <!-- INPUT ZONE -->
        <div class="input-group" id="input-section">
            <div class="terminal-box">
                <span class="prompt">~ %</span>
                <input type="text" id="idea-input" placeholder="insert an idea" autocomplete="off">
            </div>
            <button id="submit-btn">Append</button>
        </div>

        <!-- FEEDBACK -->
        <div id="feedback-message"></div>

        <!-- LIST ZONE -->
        <div id="list-container">
            <div class="list-header">Current Database_</div>
            <div id="ideas-list">
                <!-- Les idées depuis Firebase apparaîtront ici -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Configuration Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAQ29umH4nAeAvykshEZ8No77OkQpIefZo",
            authDomain: "khushi-app-3d908.firebaseapp.com",
            projectId: "khushi-app-3d908",
            storageBucket: "khushi-app-3d908.firebasestorage.app",
            messagingSenderId: "684679928446",
            appId: "1:684679928446:web:391d954452c89db681d62f"
        };
        
        // Initialisation
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ideasCollection = collection(db, "ideas");

        const successMessages = [
            "congratulations, another thing to do with your future partner.",
            "never we will be bored.",
            "great idea, nothing unexpected from someone like you :)"
        ];

        // Écoute en temps réel de la base de données
        const q = query(ideasCollection, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const listEl = document.getElementById('ideas-list');
            listEl.innerHTML = "";
            
            const totalDocs = snapshot.docs.length;

            if (totalDocs > 0) {
                document.getElementById('list-container').style.display = 'flex';
                
                snapshot.forEach((doc, index) => {
                    const data = doc.data();
                    const item = document.createElement('div');
                    item.className = 'idea-item';
                    
                    const formattedIndex = String(totalDocs - index - 1).padStart(2, '0');
                    
                    item.innerHTML = `
                        <span class="idea-index">[${formattedIndex}]</span>
                        <span class="idea-text">${data.text}</span>
                    `;
                    listEl.appendChild(item);
                });
            }
        });

        // Gérer l'ajout d'une idée
        async function submitIdea() {
            const inputEl = document.getElementById('idea-input');
            const ideaText = inputEl.value.trim();

            if (ideaText === "") return;

            inputEl.value = "";
            document.getElementById('input-section').style.display = 'none';

            try {
                await addDoc(ideasCollection, {
                    text: ideaText,
                    createdAt: serverTimestamp()
                });
            } catch (e) {
                console.error("Erreur lors de l'ajout : ", e);
            }

            const feedbackEl = document.getElementById('feedback-message');
            const randomMsg = successMessages[Math.floor(Math.random() * successMessages.length)];
            
            feedbackEl.innerText = randomMsg;
            feedbackEl.style.display = 'block';

            setTimeout(() => {
                feedbackEl.style.display = 'none';
                document.getElementById('input-section').style.display = 'flex';
            }, 3000);
        }

        document.getElementById('submit-btn').addEventListener('click', submitIdea);
        document.getElementById('idea-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') submitIdea();
        });
    </script>
</body>
</html>
